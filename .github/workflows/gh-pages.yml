# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch. Path-filtered: the site is pre-generated
  # and committed, so a push that does not touch it cannot change what would be deployed,
  # and an unconditional trigger just queues redundant deployments behind each other on
  # the shared `pages` concurrency group.
  push:
    branches: ["main"]
    paths:
      - 'docs/chronicle/**'
      - '.github/workflows/gh-pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This repo's 224 sprite renders are git-LFS build output against a 1 GB quota,
          # and the chronicle's own images are ordinary tracked files precisely so
          # publishing never touches LFS. Without this, every push to main pulls ~31 MB of
          # sprite blobs the page does not use.
          lfs: false
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: './docs/chronicle'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
