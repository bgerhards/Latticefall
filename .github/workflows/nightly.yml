name: Gate (tier 4, nightly)

# PRC-08. The full ~9-minute gate — everything `gate.yml` cannot run: `game renders`,
# `menu renders`, `accessibility` (tier 3, need a real GPU-backed Godot frame under Xvfb —
# decision 052) and `rules parity` (tier 4, 1152 simulations through both implementations,
# ~9 minutes on its own). None of that exists on a hosted `ubuntu-latest` runner. This
# workflow assumes a **self-hosted runner** that already satisfies decision 052 — a native
# Linux Godot build plus `xvfb-run` against a Mesa software-GL stack, e.g. the owner's own
# WSL2 machine — which is option 1 of the two `gate.yml`'s header comment names (a container
# image with the same three things baked in is option 2; nobody has built one, and this
# workflow does not pretend to run on it).
#
# **BAL-06 / LF-105: tier 4 also runs `rules parity (windows)`**, a second ~9-minute
# comparison against the Windows Godot build the owner actually plays, not the Linux build
# `rules parity` above uses. On a self-hosted runner with no Windows Godot reachable (this
# needs the SAME machine to also carry a Windows console build under `/mnt/*/godot/` and
# WSL interop to reach it — see `tools/toolpaths.py`'s `resolve_windows_godot()`), that
# check reports `skip, skipped_reason: "subsystem"` rather than failing the job outright
# (this workflow does not pass `gate_report.py --fail-on-subsystem-skip`, unlike
# `gate.yml`'s tier-1 job) — a skip is visible in the report, never silently a pass, but it
# also does not block a release on a runner that genuinely has no Windows build. Wiring a
# hard failure on that particular skip is a deliberate choice for whoever sets up the
# self-hosted runner this targets, once one exists with a known Windows build available.
#
# **Sharding is not wired up.** PRC-05 (`tools/test_parity.py --shard I/N`) is the intended
# way to split each parity check's 1152 runs across several self-hosted jobs; it has not
# landed as a matrix here, so this workflow runs the whole tier-4 gate (both parity checks
# included) as one job on one runner. Re-visit this once a matrix lands — the strategy
# commented below is the shape it should take, and BAL-06 measured the Windows side's own
# wall-clock as the reason `--shard` may be needed there specifically (see BAL-06's report).
#
# **Reap is report-only, not `--kill`.** A self-hosted runner is very likely the same machine
# an owner is working on interactively (CLAUDE.md's reaper section is explicit that this
# matters). PRC-07's lease-scoped `--kill` (`tools/reap.py --kill --lease <session>`) is the
# prerequisite for running `--kill` here without also killing a legitimate concurrent session
# — it has not landed either, so this workflow only *reports* what `tools/reap.py` sees
# after the run, for a human to act on. Do not add `--kill` here before PRC-07 lands.

on:
  workflow_dispatch: {}
  schedule:
    # 09:00 UTC daily. Change here, not by hand-editing a cron string elsewhere — this is the
    # only place the schedule is defined.
    - cron: "0 9 * * *"

permissions:
  contents: read

jobs:
  nightly-gate:
    if: ${{ vars.LF_NIGHTLY_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, latticefall]
    steps:
      - name: Checkout (with LFS — tier 3/4 read real sprite and audio bytes)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Report stray processes before the run (visibility only, no --kill — see header)
        run: .venv/bin/python tools/reap.py || true

      - name: Run tier-4 gate
        id: gate
        continue-on-error: true
        # TODO(PRC-05): once tools/test_parity.py --shard I/N lands, replace this single run
        # with a matrix (strategy.matrix.shard: [1, 2, 3, 4]; --json gate-tier4-${{
        # matrix.shard }}.json) and merge the JSON artifacts before rendering the report.
        run: .venv/bin/python -u tools/check.py --tier 4 --json gate-tier4.json

      - name: Render report
        if: always()
        run: .venv/bin/python tools/gate_report.py gate-tier4.json --out gate-tier4.md

      - name: Upload gate-tier4.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tier4-result
          path: |
            gate-tier4.json
            gate-tier4.md
          if-no-files-found: warn

      - name: Report stray processes after the run (visibility only, no --kill — see header)
        if: always()
        run: .venv/bin/python tools/reap.py || true

      - name: Fail if the gate failed
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "::error::tier-4 gate failed — see gate-tier4.json"
            exit 1
          fi
