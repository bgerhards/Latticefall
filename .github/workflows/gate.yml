name: Gate

# PRC-08 (tier-1 `gate` job) / PRC-17 (`build-ci-image` + `gate-tier3` jobs). The `gate` job
# runs the fast, pre-commit-equivalent slice of tools/check.py on every PR and every push to
# main — the same nine checks and the same ~5 s/10 s-budget contract PRC-04 measured
# locally, so a red run here means exactly what a red `--tier 1` means on a workstation.
#
# ## What this workflow does and does not prove
#
# Tier 1 is schema/data/script-syntax/nomenclature checks plus `gdscript parses` (a headless
# `--check-only` parse, no window, no rendering — see tools/validate/gdscript.py). None of
# that reads a sprite's pixel *values*, so this checkout is `lfs: false` — the 224 committed
# sprite renders are LFS pointer files here, never pulled. **That stops being true the moment
# this workflow (or a future one) runs tier 2**: `sprite atlas` hashes real render bytes
# (`tools/check.py`'s `check_sprite_atlas`, via `pack_atlas.source_digest`) and `sfx
# determinism` re-synthesizes and byte-compares a real `.wav` — both would either report a
# stale/missing-file FAIL against pointer files or silently pass against garbage. Flip
# `lfs: true` below before ever raising `--tier` past 1 here.
#
# `gdscript parses` needs one more thing a fresh checkout does not have: the **`Import
# project` step below**, fixing two independent problems at once, not one.
#
# (1) A `class_name` global (`Loadout`, `A11yProbe`, `OptionsMenu` — three, measured) is
# invisible to `--check-only --script <f>` in isolation until Godot's editor has imported the
# project once: the global class registry lives in `.godot/global_script_class_cache.cfg`
# (CLAUDE.md, "a new `class_name` is invisible until the editor imports"), which is gitignored
# and therefore does not exist on a fresh checkout. `tools/validate/gdscript.py` already
# filters the identically-shaped "Identifier not found" noise **autoloads** produce in
# isolation (it reads `project.godot`'s `[autoload]` block) — but a `class_name` is a
# different mechanism with the same symptom, and it has no equivalent filter, by design: an
# import makes the check true rather than making it stop looking.
#
# (2) `scripts/ui_theme.gd` (the `Ui` autoload) `preload()`s four `.ttf` fonts directly, so
# under `lfs: false` those `preload()`s hit real LFS-pointer text, not a font — a genuine
# resource-load failure, unrelated to (1), and it cascades into every script that reads an
# external const off `Ui` (`hud.gd` measured). The import step happens to fix this too:
# importing a pointer-file `.ttf` still registers *some* `FontFile` resource (broken content,
# `FreeType: Error loading font` at runtime — irrelevant, nothing at tier 1 renders a glyph),
# which is enough for `preload()` to resolve and the parse to succeed.
#
# Both were confirmed by reproducing a `GIT_LFS_SKIP_SMUDGE=1` checkout of this workflow's own
# commit in a disposable `git worktree`: without the import step, `gdscript parses` fails on 7
# files (the 3 `class_name`s from (1), plus `ui_theme.gd`/`hud.gd`/`menu.gd`/`pause_menu.gd`/
# `main.gd`/`draft.gd` off the cascade in (2)) — matching this workflow's actual CI failure
# byte-for-byte. With the import step, all 35 tracked scripts parse clean. **Removing the
# import step re-breaks both**, not just whichever one prompted adding it.
#
# What the bare `ubuntu-latest gate` job above cannot prove, on any tier: `game renders`,
# `menu renders` and `accessibility` (tier 3) need a real GPU-backed Godot frame — GL
# Compatibility reads back nothing under bare `--headless` (decision 052) — which on Linux
# means a native Godot build under `xvfb-run` against a Mesa software-GL stack. `ubuntu-
# latest` has none of that. The two ways to get it in CI (`nightly.yml`'s own header
# comment named these as options 1 and 2):
#
#   1. A **self-hosted runner** on a machine that already satisfies decision 052 — e.g. the
#      owner's own WSL2 box. See `nightly.yml`, which targets exactly this. **Deliberately
#      declined** — see docs/STATE.md and docs/DECISIONS.md for the reasoning (a scheduled
#      job competing for the machine the owner plays on, and `reap.py --kill` running
#      unattended on a shared tree) — not an oversight or a "not yet".
#   2. A **container image** carrying `Godot_v4.7.1-stable_linux.x86_64`, `xvfb`, and a Mesa
#      software-GL stack pre-baked, run on a hosted runner. **This is `build-ci-image` +
#      `gate-tier3` below** (PRC-17) — built from `tools/ci/Dockerfile`, and it is what
#      puts `sprite atlas`, `sfx determinism`, `godot boots`, `terrain parsers agree`,
#      `game renders`, `menu renders`, `accessibility` and every tier-1/2/3 scenario check
#      onto every PR without any self-hosted infrastructure at all. Verified inside the
#      container (not assumed): `game renders` reports the SAME `coverage 0.95, 99 tones`
#      and `accessibility` the SAME `worst contrast 5.08:1` this project's thresholds were
#      tuned against on the owner's own machine — a bare `ubuntu:24.04` + Mesa llvmpipe
#      stack reproduces them exactly, not approximately, in every run measured while
#      building this. `rules parity` (tier 4, ~9 min for the full suite) still does not run
#      here — see `parity-shard.yml` for how that got into hosted CI anyway, via sharding
#      rather than a bigger runner.
#
# `gdscript parses` is the one tier-1 check that does need a real Godot binary — but only for
# a plain `--headless --check-only --script <f>` parse (see tools/validate/gdscript.py's
# `build_argv`, which passes `want_window=True` and therefore never touches Xvfb even when
# `toolpaths.godot_argv()` could wrap it). That needs no GPU and no display server at all, so
# unlike the four checks above it genuinely is installable on a bare hosted runner — the
# "install Godot" step below does exactly that, downloading the same official
# `Godot_v4.7.1-stable_linux.x86_64` build CLAUDE.md names, and nothing else from the engine
# or art pipeline.
#
# A run that finds `gdscript parses` (or any other tier-1 check) reporting
# `skipped_reason: "subsystem"` anyway is therefore a broken environment, not an acceptable
# skip — `tools/gate_report.py --fail-on-subsystem-skip` turns that into a job failure rather
# than a quiet green run that skipped a check nobody asked to skip.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.1-stable"

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no LFS — tier 1 never reads a sprite/audio byte, see header comment)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          # Only what tier 1 actually imports (validate_data.py's jsonschema). numpy/pillow/
          # soundfile back the art and audio pipelines tier 1 never touches — see
          # CLAUDE.md's Conventions ("stdlib + numpy/soundfile only") for why those exist at
          # all; this job has no use for them.
          .venv/bin/python -m pip install jsonschema

      - name: Install Godot (headless parse-check only — see header comment)
        run: |
          set -eu
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          BIN="$(find godot-bin -type f -name 'Godot_v*_linux.x86_64' | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::Godot binary not found in the downloaded archive — release asset name changed?"
            exit 1
          fi
          chmod +x "$BIN"
          "$BIN" --headless --version
          echo "LF_GODOT=$PWD/$BIN" >>"$GITHUB_ENV"

      - name: Import project (populates the class_name cache — see header comment)
        run: |
          set -eu
          # `--headless --path . --import` runs the editor's importer once, non-interactively.
          # This is a throwaway checkout on an ephemeral runner, not the shared tree LF-075
          # warns about (the owner plays out of a real working copy of this repo elsewhere) —
          # so "never rebuild the import cache without saying so first" does not apply here;
          # this step *is* the saying-so, for this tree only.
          #
          # Expect a wall of "Continuing"/"ERROR" lines for every LFS-pointer asset (png/wav/
          # ttf — `lfs: false`, see header comment): Godot logs a recoverable error per pointer
          # file it cannot decode as real image/audio/font content, but the import as a whole
          # still exits 0 and still registers a (broken) resource for each, which is all
          # `gdscript parses` needs. A non-zero exit here is a real problem — e.g. the release
          # archive's directory layout changing again — not more of the same noise.
          if ! "$LF_GODOT" --headless --path . --import >import.log 2>&1; then
            echo "::error::project import failed — full log follows"
            cat import.log
            exit 1
          fi
          n_lines="$(wc -l <import.log)"
          n_errors="$(grep -c '^ERROR' import.log || true)"
          echo "import ok: $n_lines log lines, $n_errors recoverable LFS-pointer resource errors (expected, see step comment)"
          tail -n 20 import.log

      - name: Run tier-1 gate
        id: gate
        continue-on-error: true
        run: .venv/bin/python -u tools/check.py --tier 1 --json gate.json

      - name: Render report and enforce no subsystem skips
        id: report
        if: always()
        continue-on-error: true
        run: |
          .venv/bin/python tools/gate_report.py gate.json --out gate.md \
            --fail-on-subsystem-skip

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tier1-result
          path: |
            gate.json
            gate.md
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        # A `pull_request` run against a fork gets a read-only GITHUB_TOKEN no matter what
        # `permissions:` above declares — GitHub's own restriction, not something this
        # workflow can opt out of short of switching to `pull_request_target` (which this
        # repo has no need for: it is a single-contributor project, per `git lfs env`'s
        # origin). `continue-on-error` so that restriction shows up as a skipped comment,
        # not a gate failure the owner has to go debug.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          # Default GITHUB_TOKEN only — no extra auth, per PRC-08's task list.
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('gate.md', 'utf8');
            } catch (e) {
              body = '### Gate — tier 1\n\nThe gate did not produce a report at all — see the workflow run.';
            }
            const marker = '<!-- latticefall-gate-comment -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail if the gate or the subsystem-skip check failed
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "::error::tier-1 gate failed — see gate.json / the PR comment"
            exit 1
          fi
          if [ "${{ steps.report.outcome }}" != "success" ]; then
            echo "::error::a tier-1 check skipped for a missing subsystem — broken CI environment"
            exit 1
          fi

  # PRC-17. Builds tools/ci/Dockerfile (Godot 4.7.1 linux + xvfb + Mesa + the python venv
  # tier 2/3 need) and pushes it to GHCR, tagged both with this exact commit's SHA (what
  # `gate-tier3` below actually runs against, so a Dockerfile change in THIS PR is tested by
  # THIS PR's own run, never a stale image) and a floating `:tier3` tag (what `parity-
  # shard.yml` uses — see that workflow's header comment on why it deliberately does not
  # rebuild per shard). `cache-from`/`cache-to: type=gha` means an unchanged Dockerfile
  # rebuilds from cache in seconds rather than re-downloading Godot every run.
  build-ci-image:
    name: Build CI image (PRC-17)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout (no LFS — the image build context is tools/ci/, text only)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - id: image
        run: echo "image=ghcr.io/${{ github.repository_owner }}/latticefall-ci:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: tools/ci
          file: tools/ci/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ghcr.io/${{ github.repository_owner }}/latticefall-ci:tier3
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # PRC-17. Tier 2/3 of tools/check.py, inside the image `build-ci-image` just built and
  # pushed — see that job and this file's header comment (option 2) for why this needs no
  # self-hosted runner. `lfs: true` here, unlike the tier-1 `gate` job above: `sprite atlas`
  # hashes real render bytes and `sfx determinism` byte-compares a real `.wav` — both need
  # real content, not LFS pointer text (see the tier-1 job's own header comment on this
  # exact trap). Runs tier 3, which is a strict superset of tiers 1 and 2 (CLAUDE.md: "a
  # tier is a minimum") — one job proves all three rather than three separate ones re-
  # paying the same checkout/import cost.
  gate-tier3:
    name: Gate (tier 3, container)
    needs: build-ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    permissions:
      contents: read
      pull-requests: write
      packages: read
    steps:
      - name: Checkout (with LFS — tier 2/3 read real sprite and audio bytes)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Import project (populates the class_name cache — see the gate job's header comment)
        run: |
          set -eu
          # PRC-17 postmortem: this step was missing on the first real CI run of this job
          # (PR #102, run 30659708967) and every Godot-launching check failed or timed out
          # as a result — `gdscript parses` on the exact `Loadout` class_name error the
          # tier-1 `gate` job's header comment already documents, `godot boots` on the
          # exact font-preload error, and every scenario/rendered check timing out at 120s/
          # ~300s waiting for a frame that unimported Godot can never produce (that alone
          # was ~25 of the run's 27 minutes). Reproduced locally against a genuinely fresh,
          # never-imported clone with real LFS bytes already present — confirms this is the
          # missing-import gap, not missing LFS content or an image defect. `$LF_GODOT` is
          # baked into the image's own ENV (see tools/ci/Dockerfile) — no download step
          # needed here the way the tier-1 `gate` job needs one on bare `ubuntu-latest`.
          if ! "$LF_GODOT" --headless --path . --import >import.log 2>&1; then
            echo "::error::project import failed — full log follows"
            cat import.log
            exit 1
          fi
          n_lines="$(wc -l <import.log)"
          n_errors="$(grep -c '^ERROR' import.log || true)"
          echo "import ok: $n_lines log lines, $n_errors recoverable errors"
          # Unlike the tier-1 `gate` job (lfs: false, so it EXPECTS a wall of recoverable
          # LFS-pointer errors), this job's checkout is `lfs: true` — real bytes are
          # already on disk (measured: 0 errors here against the current image/checkout).
          # A non-zero count is worth reading, not assumed-expected the way it is above.
          tail -n 20 import.log

      - name: Run tier-3 gate
        id: gate
        continue-on-error: true
        # `python` on PATH resolves to the image's own /opt/venv (baked in via Dockerfile
        # ENV) — no per-run `pip install`, unlike the tier-1 `gate` job's venv-from-scratch
        # step, because this job's whole point is amortising that cost into the image.
        run: python -u tools/check.py --tier 3 --json gate-tier3.json

      - name: Render report and enforce no subsystem skips
        id: report
        if: always()
        continue-on-error: true
        run: |
          python tools/gate_report.py gate-tier3.json --out gate-tier3.md \
            --fail-on-subsystem-skip

      - name: Upload gate-tier3.json
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-tier3-result
          path: |
            gate-tier3.json
            gate-tier3.md
          if-no-files-found: warn

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        # Same fork restriction and the same reason for `continue-on-error` as the tier-1
        # job's identical step above — see that step's comment.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync('gate-tier3.md', 'utf8');
            } catch (e) {
              body = '### Gate — tier 3 (container)\n\nThe gate did not produce a report at all — see the workflow run.';
            }
            const marker = '<!-- latticefall-gate-tier3-comment -->';
            body = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail if the gate or the subsystem-skip check failed
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" != "success" ]; then
            echo "::error::tier-3 gate failed — see gate-tier3.json / the PR comment"
            exit 1
          fi
          if [ "${{ steps.report.outcome }}" != "success" ]; then
            echo "::error::a tier-3 check skipped for a missing subsystem — broken container image"
            exit 1
          fi
