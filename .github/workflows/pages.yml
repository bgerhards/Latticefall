name: chronicle

# The build journal (docs/chronicle/) published to GitHub Pages on every push to main.
#
# Deliberately dumb: the site is pre-generated by tools/chronicle.py and COMMITTED, so this
# workflow only uploads it. No build step, no toolchain, no dependency that can rot — which
# matters because the whole point of the journal is that it is still readable years from now.
# If the generator changes, the regenerated HTML lands in the same commit as the change.
#
# lfs: false is load-bearing. This repo's sprite renders are git-LFS build output against a
# 1 GB quota, and the chronicle's own images live in docs/chronicle/assets/ as ordinary
# tracked files precisely so publishing never touches LFS.

on:
  push:
    branches: [main]
    paths:
      - 'docs/chronicle/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older queued one but never cancels a
# deployment already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/chronicle
      - id: deployment
        uses: actions/deploy-pages@v4
